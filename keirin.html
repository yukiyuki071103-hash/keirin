<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ポケット車券 競輪ゲーム</title>
<meta name="description" content="架空の競輪場で遊ぶ車券ゲーム。ライン戦・ジャン・捲りを再現したドット絵レースで、1日モードのランキングに挑戦。">
<meta property="og:type" content="website">
<meta property="og:title" content="ポケット車券">
<meta property="og:description" content="架空のバンクで遊ぶドット絵の競輪ゲーム。5万円で12レース、1日ランキングに挑戦。">
<meta property="og:url" content="https://yukiyuki071103-hash.github.io/keirin/keirin.html">
<meta property="og:image" content="https://yukiyuki071103-hash.github.io/keirin/keirin-ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* VOICE: 夜の競走場、場内アナウンスと赤ペンの予想紙
   IDEA: 出走表と車券マークシートが手元にある、バンクの売店前
   PICTURE: インフィールドから追う側面視点のドット絵中継
   COLOUR and TYPE: 深い紺、金の数字、車番9色 / DotGothic16 + 角ゴシック
   LAYOUT: 縦1列、最大560px、出走表→買い目→中継→結果 */
:root{--bg:#0a1324;--panel:#101d36;--panel2:#172a4b;--line:#25406b;--text:#eef3fb;--muted:#93a7c7;--gold:#f2c94c;--red:#ff6b6b;--green:#4cd38a;--cyan:#5fd0e6;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;overflow-x:clip}
.px,header h1,.comm,.big,.rn,.rname,.result h3,.ttl,.kim,.modal h3,.cmcopy{font-family:"DotGothic16",monospace}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 80px}
header{display:flex;align-items:center;gap:8px;padding:4px 2px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,#0a132400);z-index:5}
header h1{font-size:16px;overflow:hidden;text-overflow:ellipsis;margin:0;letter-spacing:.04em;flex:1;cursor:pointer;white-space:nowrap}
.modechip{display:none;font-size:11px;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.bal{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap;font-size:14px}
.bal b{color:var(--gold)}
.ibtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 10px;font-size:13px;min-height:36px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.raceinfo{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.rn{font-size:22px;font-weight:800}.rname{font-size:17px;color:var(--gold)}
.rmode{position:absolute;right:0;top:2px;font-size:11px;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:2px 8px}.raceinfo{position:relative}
.meta{color:var(--muted);font-size:12px;width:100%}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 3px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:11px}
td.num,th.num{text-align:right;white-space:nowrap}
.waku{display:inline-flex;width:26px;height:26px;border-radius:6px;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:1px solid rgba(0,0,0,.4);flex:none}
.w1{background:#f4f4f4;color:#111}.w2{background:#1b1b1b;color:#fff;border-color:#556}.w3{background:#e53935;color:#fff}.w4{background:#2a5cff;color:#fff}.w5{background:#f5d40f;color:#111}.w6{background:#22b35e;color:#fff}.w7{background:#ff8a1c;color:#111}.w8{background:#ff8fc4;color:#111}.w9{background:#8e44d6;color:#fff}
.rname2{font-weight:700;white-space:nowrap}
.sub{color:var(--muted);font-size:11px;display:block;white-space:nowrap}
.cls{font-size:10px;font-weight:800;padding:0 4px;border-radius:4px;margin-right:3px}
.S1{background:#f2c94c;color:#111}.S2{background:#e0874a;color:#111}.A1{background:#4b6a9b;color:#fff}.A2{background:#3a4f7a;color:#dde}.A3{background:#2a3242;color:#aab}
.odds{font-weight:800;color:var(--gold)}
.pop1{color:var(--red)}
.mk{font-weight:800}.mk.g{color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:6px;margin-bottom:8px}.seg .tab{font-size:12px;white-space:nowrap;padding:9px 2px}
.tab{padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;font-weight:700;min-height:40px}
.tab.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.seg .tab.on{background:var(--cyan);border-color:var(--cyan);color:#06222a}
.hint{color:var(--muted);font-size:12px;margin:0 0 8px}
.mrow{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.lblbtn{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:8px;height:42px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-size:11px!important}.lblbtn b{color:var(--cyan);font-size:13px}.lblbtn.on{border-color:var(--cyan);background:#0f3a46}
.mrow .lbl{width:34px;font-size:12px;color:var(--muted);flex:none}
.mrow .bx{flex:1;display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.bb{height:42px;border-radius:8px;border:2px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;padding:0}
.bb.on{border-color:var(--gold);background:#3a3417}
.bb .waku{width:24px;height:24px;font-size:13px}
.narabi{margin:-4px 0 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lineg{display:inline-flex;gap:1px;padding:2px;border:1px solid var(--line);border-radius:8px;margin-right:4px}.lineg .waku{width:22px;height:22px;font-size:12px}
.preview{background:var(--panel2);border-radius:10px;padding:8px 10px;margin:4px 0 10px;font-size:14px;min-height:20px}
.amt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.amt input{width:130px;padding:9px;border-radius:10px;border:1px solid var(--line);background:#07101f;color:var(--text);font-size:16px;text-align:right}
.chip{padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;min-height:38px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font-size:16px;font-weight:800;background:var(--gold);color:#1a1a1a;min-height:48px}
.btn:disabled{opacity:.4}
.btn.go{background:var(--green);color:#062312;font-size:18px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.cyan{background:var(--cyan);color:#06222a}
.btn.sm{padding:9px;font-size:14px;min-height:40px}
.btn.xshare{background:#000;color:#fff;border:1px solid #555}
.grp{border-bottom:1px dashed var(--line);padding:8px 0}
.grp:last-child{border-bottom:0}
.grp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.grp .t1{font-weight:700}.grp .t2{color:var(--muted);font-size:12px}
.grp .x{background:none;border:0;color:var(--muted);font-size:18px;padding:6px 10px;min-height:40px}
.grp.win .t1{color:var(--gold)}.grp.lose{opacity:.6}
.clist{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.clist span{font-size:12px;background:var(--panel2);border-radius:6px;padding:2px 6px;white-space:nowrap}
.clist .w{background:#5a4a12;color:var(--gold)}.clist .r{background:#24405a;color:var(--cyan)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:8px}
.total{display:flex;justify-content:space-between;padding-top:10px;font-weight:700}
.racebox{position:relative}
canvas.race{width:100%;display:block;border-radius:10px;background:#8fcfff;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:6px}
.kim{font-size:34px;color:#fff;text-shadow:0 2px 0 #000,0 0 12px #000;letter-spacing:.1em}
.ordline{display:flex;gap:4px;background:#000a;padding:6px 10px;border-radius:10px}
.comm{margin-top:8px;font-size:17px;min-height:24px;text-align:center;color:var(--gold)}
.live{margin-top:4px;font-size:13px;color:var(--text);text-align:center;min-height:18px;font-family:"DotGothic16",monospace}
.stl{font-size:11px;color:var(--muted);text-align:center;min-height:16px;font-family:"DotGothic16",monospace}
.result h3{margin:0 0 8px;font-size:17px}
.rank{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.rank .pos{width:34px;font-weight:800;text-align:center;font-family:"DotGothic16",monospace}
.big{font-size:28px;text-align:center;margin:8px 0}
.big.plus{color:var(--gold)}.big.minus{color:var(--muted)}
.kimbig{font-size:22px;text-align:center;margin:6px 0 10px;color:var(--cyan);font-family:"DotGothic16",monospace}
.note{font-size:12px;color:var(--cyan);background:#0f2b3a;border-radius:8px;padding:6px 8px;margin:6px 0}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:11px;text-align:center;margin-top:16px;line-height:1.6}
/* 予想屋 */
.yoso{display:flex;gap:10px;align-items:flex-start}
.yoso canvas{width:56px;height:56px;image-rendering:pixelated;flex:none;border-radius:10px;background:#20365c}
.bubble{position:relative;background:#f4f1e6;color:#1a1a1a;border-radius:12px;padding:8px 10px;font-size:14px;flex:1;line-height:1.5}
.bubble:before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-right-color:#f4f1e6;border-left:0}
.bubble b{color:#c62828}
.yname{font-size:11px;color:var(--muted);margin-top:4px;text-align:center}
/* タイトル */
.title{padding-top:6px}
.ttl{font-size:34px;line-height:1.1;text-align:center;margin:14px 0 4px;color:#fff;text-shadow:0 3px 0 #1f4f8a}
.ttlsub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
canvas.hero{width:100%;display:block;border-radius:14px;image-rendering:pixelated;margin-bottom:14px}
.mode{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;color:var(--text)}
.mode .mt{font-family:"DotGothic16",monospace;font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.mode .mt small{font-size:13px;color:var(--gold);font-family:inherit}
.mode p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.mode.day{border-color:#7a6620}
/* モーダル */
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:14px 14px 24px}
.modal.center{align-items:center}.modal.center .sheet{border-radius:16px;margin:12px;max-width:420px}
.modal h3{margin:0 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.modal h2{font-size:13px;color:var(--muted);font-weight:600}
.acct{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:4px 0 12px;font-size:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kv div{background:var(--panel2);border-radius:10px;padding:8px}
.kv small{display:block;color:var(--muted);font-size:11px}
.kv b{font-size:17px;font-family:"DotGothic16",monospace}
.btnrow{display:flex;gap:8px;margin-top:12px}
.me td{color:var(--gold)}
/* CM */
.cm .sheet{text-align:center}
canvas.cmc{width:100%;image-rendering:pixelated;border-radius:10px;display:block}
.cmcopy{font-size:20px;margin:10px 0 4px}
.cmsp{font-size:11px;color:var(--muted)}
.cmcount{font-size:13px;color:var(--gold);margin-top:8px;font-family:"DotGothic16",monospace}
/* オッズ表 */
.otab{table-layout:fixed;font-family:"DotGothic16",monospace}.otab th,.otab td{padding:5px 0;text-align:center;font-size:11px;border:1px solid var(--line)}
.otab th .waku{width:20px;height:20px;font-size:11px}.otab thead th:first-child{font-size:9px;font-family:inherit;color:var(--muted)}
.oc{cursor:pointer;color:var(--text)}.oc.na{background:#0b1529;cursor:default}.oc.h10,.pi.h10 b,.h10t{color:var(--gold)}.oc.h3{background:#5a1f26;color:#ffd0d0;font-weight:700}.h3t{color:#ff9a9a}
.fpick{display:grid;grid-template-columns:auto repeat(9,1fr);gap:3px;align-items:center;margin-bottom:8px}.fpick .bb{height:36px}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:4px}.pi{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:8px;padding:5px 7px;cursor:pointer}.pi small{color:var(--muted);width:18px;font-size:10px}.pi span{display:flex;gap:1px}.pi .waku{width:20px;height:20px;font-size:11px}.pi b{margin-left:auto;font-family:"DotGothic16",monospace}.pi.h3{background:#5a1f26}.pi.h3 b{color:#ffd0d0}
/* 選手ページ・名鑑 */
.rl{cursor:pointer;text-decoration:underline dotted #5a7299;text-underline-offset:3px}
.rhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted);margin:-4px 0 10px}
.cls.SS{background:linear-gradient(90deg,#fff3b0,#f2c94c,#fff3b0);color:#3a2a00;box-shadow:0 0 0 1px #fff6}
.mv{font-size:11px;font-weight:800;margin-left:4px}.mv.up{color:#ff8f8f}.mv.dn{color:#7fb2ff}
.kimrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.kimrow div{background:var(--panel2);border-radius:8px;padding:6px;text-align:center}.kimrow small{display:block;color:var(--muted);font-size:11px}.kimrow b{font-family:"DotGothic16",monospace;font-size:17px}
.kimbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}
.recent{display:flex;flex-wrap:wrap;gap:5px}.rc{background:var(--panel2);border-radius:8px;padding:4px 6px;text-align:center;min-width:44px}.rc small{display:block;font-size:10px;color:var(--muted);line-height:1.3}.rc .km{color:var(--cyan)}
.pl{font-family:"DotGothic16",monospace;font-size:15px}.pl.p1{color:var(--gold)}.pl.p2{color:#dfe6ef}.pl.p3{color:#e0a46a}.pl.px{color:var(--red)}.rc .pl:not(.p1):not(.p2):not(.p3):not(.px){color:var(--muted)}
.spark{width:100%;height:60px;display:block;background:var(--panel2);border-radius:8px}.sparkax{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.prow small{color:var(--muted)}
.ctabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0}.ctabs .tab{padding:6px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;line-height:1.2}.ctabs .tab small{font-size:10px;font-weight:400}
table.roster tr{cursor:pointer}
.ehd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ehd h2{margin:0!important}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}
.jack{position:fixed;left:0;right:0;top:35%;text-align:center;font-family:"DotGothic16",monospace;font-size:48px;color:var(--gold);text-shadow:0 4px 0 #6b4a00,0 0 20px #000;z-index:26;pointer-events:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script src="keirin-firebase-config.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="hTitle" title="タイトルへ"></h1>
    <span class="modechip hidden" id="modeChip"></span>
    <button class="ibtn" id="sndBtn" aria-label="効果音"></button>
    <button class="ibtn hidden" id="statsBtn">成績</button>
    <div class="bal hidden" id="balBox"><b id="bal">0</b>円</div>
  </header>

  <!-- タイトル画面 -->
  <section id="titleScr" class="title">
    <div class="ttl" id="tTitle"></div>
    <div class="ttlsub" id="tSub"></div>
    <canvas class="hero" id="hero"></canvas>
    <div id="modeList"></div>
    <div id="acct" class="acct"></div>
    <button class="btn ghost" id="rankOpen">🏆 今日のランキング（1日モード）</button>
    <button class="btn ghost" id="rosterOpen" style="margin-top:10px">👤 選手名鑑（500人）</button>
  </section>

  <!-- ゲーム画面 -->
  <section id="gameScr" class="hidden">
    <div class="card">
      <div class="raceinfo">
        <span class="rn" id="rnum">1R</span>
        <span class="rname" id="rname"></span>
        <span class="meta" id="rmeta"></span>
        <span class="rmode" id="rmode"></span>
      </div>
    </div>

    <div class="card" id="yosoCard">
      <div class="yoso">
        <div><canvas id="face" width="16" height="16"></canvas><div class="yname" id="yName"></div></div>
        <div class="bubble" id="yText"></div>
      </div>
      <button class="btn sm cyan" id="yBuy" style="margin-top:10px">この買い目を買う</button>
    </div>

    <div class="card" id="entryCard">
      <div class="ehd"><h2>出走表 <small style="font-weight:400">（名前をタップで選手ページ）</small></h2><button class="chip" id="rosterBtn">👤 名鑑</button></div>
      <div class="narabi"><span class="sub" style="display:inline">並び予想</span> <span id="narabi"></span></div>
      <table>
        <thead><tr><th>車</th><th>選手</th><th>級班<br>脚質</th><th class="num">得点<br>B</th><th class="num">2連<br>対率</th><th class="num">人気<br>1着率</th></tr></thead>
        <tbody id="entries"></tbody>
      </table>
    </div>

    <div class="card" id="betCard">
      <div class="ehd"><h2>車券を買う</h2><button class="chip" id="oddsBtn">📋 オッズ表</button></div>
      <div class="tabs" id="tabs"></div>
      <div class="seg" id="seg"></div>
      <p class="hint" id="hint"></p>
      <div id="sheet"></div>
      <div class="preview" id="preview"></div>
      <div class="amt">
        <input id="amount" type="number" inputmode="numeric" min="100" step="100" value="100" aria-label="1点あたりの金額">
        <span>円 / 1点</span>
        <span id="chips" style="display:contents"></span>
        <button class="chip" id="amtReset">リセット</button>
      </div>
      <button class="btn" id="addBtn" disabled>この車券を買う</button>
    </div>

    <div class="card" id="ticketCard">
      <h2>購入した車券</h2>
      <div id="tickets"></div>
      <div class="total"><span>合計</span><span id="ttotal">0 円</span></div>
    </div>

    <button class="btn go" id="startBtn">🚩 発走！</button>
    <button class="btn cyan hidden" id="reviveBtn" style="margin-top:10px"></button>
    <button class="btn ghost sm hidden" id="dayRestart" style="margin-top:10px">この挑戦をやめて最初からやり直す</button>

    <div class="card hidden" id="raceCard" style="margin-top:12px">
      <div class="racebox">
        <canvas class="race" id="cv"></canvas>
        <div class="overlay hidden" id="ovl"></div>
      </div>
      <div class="stl" id="stl"></div>
      <div class="comm" id="comm"></div>
      <div class="live" id="live"></div>
      <button class="btn ghost sm" id="skipBtn" style="margin-top:8px">結果まで飛ばす</button>
    </div>

    <div class="card result hidden" id="resultCard">
      <h3>🏁 レース結果</h3>

<script>
{
// ===== 競輪エンジン（選手・ライン・展開シミュレーション・オッズ・精算） =====
const ENG = (() => {
  function hashStr(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; }
  function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function makeRng(seed){
    const r=mulberry(typeof seed==='number'?seed:hashStr(String(seed)));
    r.range=(a,b)=>a+r()*(b-a); r.int=(a,b)=>Math.floor(a+r()*(b-a+1)); r.pick=a=>a[Math.floor(r()*a.length)];
    r.gauss=()=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
    r.shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
    return r;
  }
  const N=9;
  const SEI=['赤坂','岩永','大塚','小倉','片岡','北川','黒田','小松','坂口','佐野','柴田','新田','杉本','関口','高木','田村','長尾','中島','西岡','野口','橋本','早川','平井','藤原','松岡','宮下','村井','森本','山口','吉村','和田','今泉','久保','清水','堀','内藤','青木','石井','上田','遠藤','大西','加藤','川口','菊地','工藤','近藤','斎藤','酒井','島田','菅原','竹内','千葉','土屋','中野','原田','福田','前田','増田','三浦','水野','森田','安田','横山','渡辺'];
  const MEI=['健太','翔太','大樹','拓也','雄一','裕介','直樹','亮','俊','剛','誠','健','隆之','康平','匠','颯','蓮','慎吾','智之','将','輝','優','航','大地','一真','龍','大輔','和也','達也','雄太','光','陸','悠斗','圭','崇','学'];
  const AREA={
    '北日本':['青森','岩手','宮城','福島','北海道'],'関東':['茨城','栃木','群馬','埼玉'],'南関東':['千葉','東京','神奈川','静岡'],
    '中部':['富山','石川','岐阜','愛知','三重'],'近畿':['福井','京都','奈良','大阪','兵庫','和歌山'],'中国':['岡山','広島','山口'],
    '四国':['徳島','香川','愛媛','高知'],'九州':['福岡','佐賀','長崎','熊本','大分']
  };
  const AREAS=Object.keys(AREA);
  const PATTERNS=[[3,3,3],[3,3,2,1],[3,2,2,2],[4,3,2],[3,3,2,1],[2,2,2,2,1],[3,2,2,1,1],[4,2,2,1]];
  const CLS={S1:[107,118],S2:[100,110],A1:[90,97],A2:[84,92],A3:[72,84]};
  const T=0.75;
  const BET_TYPES=[
    {id:'nt', name:'2車単', k:2, ordered:true,  multi:true, desc:'1着→2着を順番通りに当てる'},
    {id:'nf', name:'2車複', k:2, ordered:false, multi:true, desc:'1・2着の2車を当てる（順不同）'},
    {id:'kf', name:'ワイド', k:2, ordered:false, multi:true, desc:'3着までに入る2車を当てる（順不同）'},
    {id:'st', name:'3連単', k:3, ordered:true,  multi:true, desc:'1着→2着→3着を順番通りに当てる'},
    {id:'sf', name:'3連複', k:3, ordered:false, multi:true, desc:'1〜3着の3車を当てる（順不同）'},
  ];
  const keyO=a=>a.join('-'), keyU=a=>[...a].sort((x,y)=>x-y).join('=');
  const keyOf=(bt,a)=>bt.ordered?keyO(a):keyU(a);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const sig=x=>1/(1+Math.exp(-x));
  const MARGINS=[['タイヤ差',0.08],['1/8車輪',0.1],['1/4車輪',0.17],['1/2車輪',0.35],['3/4車輪',0.5],['1車輪',0.7],['1/2車身',0.9],['3/4車身',1.35],['1車身',1.8],['1車身半',2.7],['2車身',3.6],['3車身',5.4],['大差',9]];

  // ---- 出走メンバーとライン ----
  function genField(rng, cls){
    const pat=rng.pick(PATTERNS), areas=rng.shuffle(AREAS), used=new Set();
    const riders=[], lines=[];
    pat.forEach((size,li)=>{
      const area=areas[li], line=[];
      for(let k=0;k<size;k++){
        let sei; do{ sei=rng.pick(SEI); }while(used.has(sei)); used.add(sei);
        const c = cls==='S' ? (rng()<0.35?'S1':'S2') : (rng()<0.3?'A1':rng()<0.6?'A2':'A3');
        const [lo,hi]=CLS[c]; let score=Math.round(rng.range(lo,hi)*100)/100;
        // 先頭は自力型（逃・両）、番手以降は追込が多い
        const type = size===1 ? rng.pick(['逃','両','追','両']) : k===0 ? (rng()<0.65?'逃':'両') : (rng()<0.8?'追':'両');
        if(k===0 && size>1) score=Math.round((score+rng.range(-1,2))*100)/100;
        const ki=rng.int(80,127), age=clamp(Math.round(20+(127-ki)*0.45+rng.range(0,6)),20,58);
        const pow = (score-(cls==='S'?108:87))/9 + (type==='逃'?0.5:type==='両'?0.25:-0.6) + rng.gauss()*0.25;
        const r={name:sei+' '+rng.pick(MEI), pref:rng.pick(AREA[area]), area, cls:c, score, type, ki, age, pow,
          gear: rng()<0.8?'3.92':rng.pick(['3.93','4.00','3.85','4.07']),
          ren2: Math.round(clamp(15+(score-(cls==='S'?100:80))*2.2+rng.gauss()*8,3,75)*10)/10,
          back: type==='逃'?rng.int(6,22):type==='両'?rng.int(2,12):rng.int(0,3), line:li, pos:k, q:score};
        riders.push(r); line.push(r);
      }
      lines.push(line);
    });
    // 車番はラインと無関係に割り振る
    const nos=rng.shuffle([1,2,3,4,5,6,7,8,9]);
    riders.forEach((r,i)=>r.no=nos[i]);
    riders.sort((a,b)=>a.no-b.no);
    const L=lines.map(l=>l.map(r=>r.no));
    return {riders, lines:L};
  }

  // ---- 展開シミュレーション（1レース分） ----
  function sim(field, rng, excl){
    const rd=n=>field.riders[n-1];
    const lines=field.lines.map(l=>l.filter(n=>n!==excl)).filter(l=>l.length);
    const F0=rng.shuffle(lines.map((_,i)=>i));
    const z=n=>(rd(n).q-field.base)/8;
    const pw=li=>{ const n=lines[li][0], r=rd(n); return r.pow + (r.type==='追'?-0.5:0) + (lines[li][0]!==field.lines.find(l=>l.includes(n))[0]?-0.6:0); };
    // 主導権
    const wA=lines.map((l,i)=>Math.exp(1.5*pw(i)+0.25*(l.length-1)+(rd(l[0]).type==='逃'?0.7:0)+rng.gauss()*0.4));
    let x=rng()*wA.reduce((a,b)=>a+b,0), A=0; for(;A<lines.length-1;A++){ x-=wA[A]; if(x<=0)break; }
    // 捲り
    let M=-1, ok=false;
    const cand=lines.map((l,i)=>i).filter(i=>i!==A && rd(lines[i][0]).type!=='追');
    if(cand.length && rng()<0.8){
      M=cand.map(i=>[i,pw(i)+rng.gauss()*0.6]).sort((a,b)=>b[1]-a[1])[0][0];
      ok = rng() < sig(1.5*(pw(M)-pw(A)) + 0.4 - (lines[A].length>=2?0.3:0));
    }
    const front = ok?M:A;
    // 主導権を取ったあとの並び（F1）
    const F1=[A,...F0.filter(i=>i!==A)];
    const lf=lines.map(()=>rng.gauss()*0.3);
    const perf={};
    lines.forEach((l,li)=>l.forEach((n,k)=>{
      let b=z(n)*0.85+rng.gauss()*0.6+lf[li];
      if(li===front){ b+= k===0?(ok?1.05:0.5):k===1?1.15:k===2?0.5:0.2; }
      else if(li===A && ok){ b+= k===0?-0.9:k===1?0.15:-0.2; }
      else if(li===M && !ok){ b+= k===0?-0.8:k===1?-0.35:-0.5; }
      else { const back=F1.indexOf(li)/F1.length; b+= (k===0?0.05:-0.1) - back*0.25; }
      perf[n]=b;
    }));
    const order=Object.keys(perf).map(Number).sort((a,b)=>perf[b]-perf[a]);
    return {order, lines, F0, F1, A, M, ok, front, B: lines[front][0]};
  }
  // 決まり手
  function kimarite(s, n, place, order){
    const li=s.lines.findIndex(l=>l.includes(n)), k=s.lines[li].indexOf(n);
    const prev=place>0?order[place-1]:null;
    if(place>0 && k>0 && s.lines[li][k-1]===prev) return 'マーク';
    if(li===s.front && k===0) return s.ok?'捲り':'逃げ';
    if(li===s.front) return '差し';
    if(k===0 && s.lines[li].length>=1 && li!==s.A) return '捲り';
    return '差し';
  }

  // ---- 確率（モンテカルロ）とオッズ ----
  function computeProbs(field, rng, NS){
    const cnt={}; const w1=Array(N+1).fill(0);
    for(let i=0;i<NS;i++){ const o=sim(field,rng).order; const k=keyO(o.slice(0,3)); cnt[k]=(cnt[k]||0)+1; w1[o[0]]++; }
    // PLで平滑化
    const ps=field.riders.map(r=>Math.exp((r.q-field.base)/8*0.4)); const S=ps.reduce((a,b)=>a+b,0); const p=ps.map(v=>v/S);
    const pr={nt:{},nf:{},kf:{},st:{},sf:{}}, ALPHA=400;
    for(let i=0;i<N;i++) for(let j=0;j<N;j++){ if(j===i)continue; for(let k=0;k<N;k++){ if(k===i||k===j)continue;
      const q=p[i]*p[j]/(1-p[i])*p[k]/(1-p[i]-p[j]);
      const a=[i+1,j+1,k+1], t=((cnt[keyO(a)]||0)+ALPHA*q)/(NS+ALPHA);
      pr.st[keyO(a)]=t;
      const ks=keyU(a); pr.sf[ks]=(pr.sf[ks]||0)+t;
      const k2=keyO([i+1,j+1]); pr.nt[k2]=(pr.nt[k2]||0)+t;
      const ku=keyU([i+1,j+1]); pr.nf[ku]=(pr.nf[ku]||0)+t;
      [[i,j],[i,k],[j,k]].forEach(([x,y])=>{ const kw=keyU([x+1,y+1]); pr.kf[kw]=(pr.kf[kw]||0)+t; });
    }}
    const win=Array(N+1).fill(0); for(const k in pr.st){ win[+k.split('-')[0]]+=pr.st[k]; }
    return {pr, win};
  }

  function genRace(seed, opts={}){
    const rng=makeRng(seed);
    const cls=opts.cls||'A';
    const field=opts.field||genField(rng,cls);
    field.base = cls==='S'?108:87;
    const {pr,win}=computeProbs(field, makeRng(seed+'mc'), opts.ns||9000);
    const odds={};
    for(const bt of BET_TYPES){ odds[bt.id]={}; for(const k in pr[bt.id]) odds[bt.id][k]=Math.min(99999.9,Math.max(1.0,Math.floor(T/pr[bt.id][k]*10)/10)); }
    const pops=field.riders.map(r=>r.no).sort((a,b)=>win[b]-win[a]);
    field.riders.forEach(r=>{ r.pop=pops.indexOf(r.no)+1; r.win=win[r.no]; });
    // ---- 事故と結果 ----
    const rr=makeRng(seed+'result');
    let acc=null; const xa=rr();
    if(xa<0.01) acc={type:'KET', no:rr.int(1,9)};
    const s=sim(field, rr, acc&&acc.type==='KET'?acc.no:null);
    let cross=[...s.order];            // ゴール線を通過する順
    if(xa>=0.01 && xa<0.03){ const c=cross[rr.int(2,cross.length-1)]; acc={type:'RAK', no:c}; cross=cross.filter(n=>n!==c); }
    else if(xa>=0.03 && xa<0.045){ acc={type:'SIK', no:cross[rr.int(0,3)]}; }
    const order=cross.filter(n=>!(acc&&acc.type==='SIK'&&n===acc.no));
    const kim={}; order.slice(0,3).forEach((n,i)=>kim[n]=kimarite(s,n,i,order));
    // 着差
    const margins=[]; for(let i=1;i<cross.length;i++){ const r=rr(); const j= i<=2 ? Math.floor(r*r*9) : Math.min(MARGINS.length-1, Math.floor(r*8)+2+(i>5?2:0)); margins.push(MARGINS[j]); }
    const yoso=makeYoso(rr,field,win);
    return {seed, field, riders:field.riders, lines:field.lines, odds, win, acc, story:s, cross, order, kim, kimW:kim[order[0]], margins, yoso, cls, animSeed:hashStr(seed+'a')};
  }

  function makeYoso(rng, field, win){
    const rd=n=>field.riders[n-1];
    // 一番強いラインを本線に
    const ls=field.lines.map(l=>({l, v:rd(l[0]).pow*1.2+l.reduce((a,n)=>a+(rd(n).q-field.base)/5,0)/l.length+(l.length-1)*0.25+rng.gauss()*0.4})).sort((a,b)=>b.v-a.v);
    const main=ls[0].l, sec=ls[1]?ls[1].l:[];
    const lead=main[0], ban=main[1]||sec[0], third=main[2]||sec[0]||ls[2].l[0];
    const other=sec[0]!==ban?sec[0]:(ls[2]?ls[2].l[0]:third);
    const cand=[[ban,lead,third],[lead,ban,third],[ban,lead,other],[ban,third,lead],[lead,ban,other],[other,ban,lead]];
    const n=2+Math.floor(rng()*3), picks=[];
    for(const c of cand){ if(new Set(c).size<3||c.some(x=>!x)) continue; const k=keyO(c); if(!picks.includes(k)) picks.push(k); if(picks.length>=n) break; }
    let text;
    if(main.length>=3) text=`${lead}番が先行や。番手の${ban}番が絶好位、${main.join('-')}のラインで決まりや。`;
    else if(main.length===2) text=`${lead}番の先行に${ban}番がピタリ。この2車は離れへんで。`;
    else text=`${lead}番は単騎やけど脚が違う。自力で何とかするで。`;
    const solos=field.lines.filter(l=>l.length===1&&l[0]!==lead).map(l=>l[0]);
    if(sec.length && rd(sec[0]).type!=='追') text+=`${sec[0]}番の捲りだけ注意や。`;
    else if(solos.length) text+=`単騎の${solos[0]}番が怖いけどな。`;
    return {h:ban, t:lead, ana:other, picks, text};
  }

  // ---- 買い目 ----
  function combos(bt, mode, rows){
    let out=[];
    if(mode==='box'){
      const s=[...new Set(rows[0])].sort((a,b)=>a-b);
      const rec=(cur,rest)=>{ if(cur.length===bt.k){ out.push(cur); return; } rest.forEach((x,i)=>rec([...cur,x], bt.ordered? rest.filter((_,j)=>j!==i) : rest.slice(i+1))); };
      rec([],s);
    } else { const rec=(cur,i)=>{ if(i===bt.k){ out.push(cur); return; } for(const x of rows[i]||[]){ if(!cur.includes(x)) rec([...cur,x],i+1); } }; rec([],0); }
    return [...new Set(out.map(a=>keyOf(bt,a)))].sort();
  }
  function winKeys(race){
    const [a,b,c]=race.order;
    return { nt:[keyO([a,b])], nf:[keyU([a,b])], kf:[keyU([a,b]),keyU([a,c]),keyU([b,c])], st:[keyO([a,b,c])], sf:[keyU([a,b,c])] };
  }
  const per100=o=>Math.floor(o*100/10)*10;
  const payout=(amt,o)=>per100(o)*amt/100;
  function judge(race, btId, key){
    const ns=key.split(/[-=]/).map(Number);
    if(race.acc && race.acc.type==='KET' && ns.includes(race.acc.no)) return 'refund';
    return winKeys(race)[btId].includes(key)?'win':'lose';
  }
  return {makeRng, hashStr, genRace, sim, kimarite, SEI, MEI, AREA, AREAS, PATTERNS, combos, winKeys, judge, payout, per100, BET_TYPES, keyO, keyU, keyOf, MARGINS};
})();

// ===== 競輪レース画面（インフィールドから追うカメラの側面視点） =====
const RaceView = (() => {
  const SC=6;                        // 1m = 6ドット
  const LH=150, TR_TOP=50, TR_BOT=104;
  const laneY=l=>101-l*10;
  const GOAL=2025;
  const COL=['#f4f4f4','#1b1b1b','#e53935','#2a5cff','#f5d40f','#22b35e','#ff8a1c','#ff8fc4','#8e44d6'];
  const FG=['#111','#fff','#fff','#fff','#111','#fff','#111','#111','#fff'];
  // 先頭の進み（t秒 → m）。5.6〜6.0秒は周回中のカット
  const HT=[[0,0],[1.2,7],[3,40],[5.6,125],[6.0,1000],[12,1225],[18,1425],[24.5,1625],[30.5,1825],[37,2025],[39,2052],[43,2090]];
  function H(t){ if(t<=0) return 0; for(let i=1;i<HT.length;i++){ if(t<=HT[i][0]){ const a=HT[i-1], b=HT[i]; if(i===4) return t<5.8?a[1]+ (t-5.6)*30 : b[1]-(6.0-t)*30; return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]); } } const a=HT[HT.length-1]; return a[1]+(t-a[0])*20; }
  const smooth=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
  const hash=(a,b)=>{let h=(a*374761393+b*668265263)>>>0; h=Math.imul(h^(h>>>13),1274126177)>>>0; return (h^(h>>>16))>>>0;};

  // ---- 3×5 ドット文字 ----
  const GL={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111','G':'111100101101111','O':'111101101101111','A':'010101111101101','L':'100100100100111'};
  function pxText(g,str,x,y,col,s=1){ g.fillStyle=col; [...String(str)].forEach((ch,i)=>{ const p=GL[ch]; if(!p) return; for(let k=0;k<15;k++) if(p[k]==='1') g.fillRect(Math.round(x)+(i*4+k%3)*s, Math.round(y)+(k/3|0)*s,s,s); }); }

  // ---- 自転車と選手のスプライト（ペダル8コマ） ----
  const sprC={};
  function line(g,x0,y0,x1,y1,c){ g.fillStyle=c; x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1); const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1; let e=dx+dy; for(;;){ g.fillRect(x0,y0,1,1); if(x0===x1&&y0===y1)break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} } }
  function riderSprite(no,f){
    const key=no+'_'+f; if(sprC[key]) return sprC[key];
    const c=document.createElement('canvas'); c.width=17; c.height=16; const g=c.getContext('2d');
    const jc = no===0?'#1d2b4f':COL[no-1], hc = no===0?'#f2c94c':COL[no-1];

// ===== 選手名簿と「自分だけの競輪界」 =====
// 500人の顔ぶれは固定（全員共通）。級班・競走得点・通算成績は端末に保存し、遊んだレースで進む。
const World = (() => {
  const KEY = 'keirin_world_v1', PERIOD = 60, BG = 10;
  const ORDER = ['SS', 'S1', 'S2', 'A1', 'A2', 'A3'];
  const SIZE = { SS: 9, S1: 60, S2: 90, A1: 120, A2: 110, A3: 111 };
  const ABIL = { SS: [115, 121], S1: [107, 116], S2: [100, 109], A1: [91, 98], A2: [85, 92], A3: [76, 86] };
  // 出走する級班の重み（レースの格ごと）
  const WT = {
    'A級予選': { A1: 0.4, A2: 1, A3: 1 }, 'A級準決勝': { A1: 1, A2: 0.7, A3: 0.2 },
    'S級予選': { S1: 0.5, S2: 1 }, 'S級特選': { SS: 0.5, S1: 1, S2: 0.3 },
    'S級準決勝': { SS: 0.7, S1: 1, S2: 0.3 }, 'S級決勝': { SS: 1, S1: 1 },
  };
  const PB = { 'A級予選': 86, 'A級準決勝': 89, 'S級予選': 104, 'S級特選': 108, 'S級準決勝': 108, 'S級決勝': 112 };
  const SHORT = { 'A級予選': 'A予', 'A級準決勝': 'A準', 'S級予選': 'S予', 'S級特選': '特選', 'S級準決勝': 'S準', 'S級決勝': '決勝' };
  const BONUS = [10, 6, 3, 1, -1, -3, -5, -7, -9];
  const KIM = ['逃げ', '捲り', '差し', 'マーク'];
  const r2 = v => Math.round(v * 100) / 100;

  // ---- 500人の名簿（固定の種から作るので、誰が遊んでも同じ顔ぶれ） ----
  const ROSTER = (() => {
    const rng = ENG.makeRng('pocket-roster-v1'), names = new Set(), out = [];
    ORDER.forEach(c => {
      for (let i = 0; i < SIZE[c]; i++) {
        let name; do { name = rng.pick(ENG.SEI) + ' ' + rng.pick(ENG.MEI); } while (names.has(name)); names.add(name);
        const area = rng.pick(ENG.AREAS), x = rng();
        const type = x < 0.3 ? '逃' : x < 0.6 ? '両' : '追';
        const ki = c === 'SS' ? rng.int(85, 117) : rng.int(80, 127);
        const q = r2(rng.range(...ABIL[c]));
        out.push({ id: out.length, name, area, pref: rng.pick(ENG.AREA[area]), type, ki,
          age: Math.max(20, Math.min(58, Math.round(20 + (127 - ki) * 0.45 + rng.range(0, 6)))),
          gear: rng() < 0.8 ? '3.92' : rng.pick(['3.93', '4.00', '3.85', '4.07']),
          q, pn: rng.gauss(), c0: c, s0: r2(q + rng.gauss() * 1.2) });
      }
    });
    return out;
  })();

  // ---- 保存データ ----
  let W = null;
  const fresh = () => ({ v: 1, races: 0, period: 1, news: null, r: ROSTER.map(x => ({ c: x.c0, s: x.s0, st: 0, w: [0, 0, 0], o: 0, k: [0, 0, 0, 0], b: 0, a: 0, L: [], P: {}, h: [], ch: [] })) });
  function load() {
    if (W) return W;
    try { W = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { W = null; }
    if (!W || W.v !== 1 || !Array.isArray(W.r) || W.r.length !== ROSTER.length) W = fresh();
    return W;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(W)); } catch (e) {} }
  function reset() { W = fresh(); save(); }

  // ---- レースに出る1人分の情報 ----
  function mk(id, no, li, pos, isS) {

    const est = Math.max(3, Math.min(75, 15 + (R.q - (isS ? 100 : 80)) * 2.2 + R.pn * 8));
    return { id, no, line: li, pos, name: R.name, pref: R.pref, area: R.area, type: R.type, ki: R.ki, age: R.age, gear: R.gear,
      cls: st.c, score: st.s, q: R.q,
      pow: (R.q - base) / 9 + (R.type === '逃' ? 0.5 : R.type === '両' ? 0.25 : -0.6) + R.pn * 0.25,
      ren2: st.st >= 3 ? Math.round((st.w[0] + st.w[1]) / st.st * 1000) / 10 : Math.round(est * 10) / 10,
      back: st.b };

  function build(saved, n) {
    const isS = n >= 7, riders = [];
    saved.lines.forEach((l, li) => l.forEach((no, k) => riders.push(mk(saved.ids[no - 1], no, li, k, isS))));
    riders.sort((a, b) => a.no - b.no);
    return { riders, lines: saved.lines.map(l => [...l]) };
  }
  // ---- 出走メンバー選び（同じ地区でラインを組む） ----
  function choose(seed, n) {
    load();
    const rng = ENG.makeRng(seed + 'pick'), w = WT[raceName(n)];
    const wOf = id => w[W.r[id].c] || 0;
    const elig = ROSTER.filter(R => wOf(R.id) > 0);
    const wpick = (arr, f) => { const ws = arr.map(f), t = ws.reduce((a, b) => a + b, 0); let x = rng() * t; for (let i = 0; i < arr.length; i++) { x -= ws[i]; if (x <= 0) return arr[i]; } return arr[arr.length - 1]; };
    const used = new Set(), groups = [];
    const pat = rng.pick(ENG.PATTERNS), areas = rng.shuffle(ENG.AREAS), usedA = new Set();
    pat.forEach(k => {
      let line = null;
      for (const A of areas) {
        if (usedA.has(A)) continue;
        const c = elig.filter(R => R.area === A && !used.has(R.id)), ld = c.filter(R => R.type !== '追');
        if (c.length < k || (k > 1 && !ld.length)) continue;

      }

    let i = 0; const lines = groups.map(g => g.map(R => { const no = nos[i++]; ids[no - 1] = R.id; return no; }));

  // 遊ぶレースの出走メンバー（saved があればそれを使う：途中で閉じたレースの再現用）

  // ---- 1レース分の結果を書き込む ----
  function apply(race, n) {
    const nm = raceName(n), pb = PB[nm], acc = race.acc;
    const place = {}; race.order.forEach((no, i) => place[no] = i + 1);
    race.riders.forEach(rd => {
      const st = W.r[rd.id], no = rd.no;
      if (acc && acc.type === 'KET' && acc.no === no) { st.L.unshift(['欠', SHORT[nm]]); st.L = st.L.slice(0, 10); return; }
      const bad = acc && acc.no === no && (acc.type === 'RAK' || acc.type === 'SIK');
      const p = bad ? 9 : place[no];
      st.st++;
      if (bad) { st.a++; st.o++; } else if (p <= 3) st.w[p - 1]++; else st.o++;
      if (p === 1) { const k = KIM.indexOf(race.kim[no]); if (k >= 0) st.k[k]++; }
      if (race.story.B === no) st.b++;
      const pts = bad ? pb - 12 : pb + BONUS[p - 1];
      st.s = r2(st.s + (pts - st.s) / 8);
      st.L.unshift([bad ? { RAK: '落', SIK: '失' }[acc.type] : p, SHORT[nm], p === 1 ? race.kim[no] : '']); st.L = st.L.slice(0, 10);
    });
    race.lines.forEach(l => { if (l.length < 2) return; l.forEach(a => l.forEach(b => { if (a === b) return;
      const P = W.r[race.riders[a - 1].id].P, k = race.riders[b - 1].id; P[k] = (P[k] || 0) + 1;
      const ks = Object.keys(P); if (ks.length > 24) { ks.sort((x, y) => P[x] - P[y]).slice(0, ks.length - 16).forEach(x => delete P[x]); } })); });
  }
  // 見ていない裏のレース（他の選手も走って成績が進む）
  function background() {
    const rng = ENG.makeRng(Math.random().toString(36).slice(2));
    for (let i = 0; i < BG; i++) {

      const f = build(choose('bg' + rng(), n), n); f.base = n >= 7 ? 108 : 87;
      const s = ENG.sim(f, rng), kim = {}; s.order.slice(0, 3).forEach((no, j) => kim[no] = ENG.kimarite(s, no, j, s.order));
      apply({ riders: f.riders, lines: f.lines, order: s.order, kim, story: s, acc: null }, n);
    }
  }
  // ---- 期替わり：級班の入れ替え ----
  function review() {
    const news = [];
    W.r.forEach(st => { st.h.push(st.s); st.h = st.h.slice(-12); });
    const of = c => W.r.map((st, id) => ({ st, id })).filter(x => x.st.c === c);
    const moves = [];
    [['SS', 'S1', 2, true], ['S1', 'S2', 6], ['S2', 'A1', 8], ['A1', 'A2', 8], ['A2', 'A3', 8]].forEach(([up, lo, k, cond]) => {
      const dn = of(up).sort((a, b) => a.st.s - b.st.s).slice(0, k), upc = of(lo).sort((a, b) => b.st.s - a.st.s).slice(0, k);
      for (let i = 0; i < k; i++) { if (cond && !(upc[i].st.s > dn[i].st.s)) continue; moves.push([upc[i].id, lo, up], [dn[i].id, up, lo]); }
    });
    moves.forEach(([id, from, to]) => { W.r[id].c = to; W.r[id].ch.push([W.period, from, to]); news.push({ id, from, to }); });
    W.period++; W.news = { period: W.period, list: news };

  }
  // 遊んだレースの精算時に呼ぶ
  function record(race, n) {
    load(); apply(race, n); background();
    W.races++; let news = null;
    if (W.races % PERIOD === 0) news = review();

  }

  const get = id => ({ ...ROSTER[id], ...load().r[id] });
  const left = () => PERIOD - (load().races % PERIOD);
  return { ROSTER, ORDER, SIZE, KIM, load, save, reset, field, record, get, left, PERIOD,
    period: () => load().period, news: () => load().news, races: () => load().races };
})();

// ===== 精算 =====
function settle(r, groups) {
  let spent = 0, pay = 0, ref = 0; const out = [];
  const win = ENG.winKeys(r);
  groups.forEach(gp => {
    let gpay = 0, gref = 0, ghit = 0; const st = {};
    gp.keys.forEach(k => {
      const j = ENG.judge(r, gp.bt, k); st[k] = j;
      if (j === 'win') { const p = ENG.payout(gp.unit, gp.odds[k]); gpay += p; ghit++; const bt = btById(gp.bt);
        if (!S.stats.best || p > S.stats.best.amt) S.stats.best = { amt: p, type: bt.name, key: k, race: r.label, mode: MODES[mode].name }; }
      if (j === 'refund') gref += gp.unit;
    });
    const cost = gp.unit * gp.keys.length; spent += cost; pay += gpay; ref += gref;
    const t = S.stats.byType[gp.bt] || (S.stats.byType[gp.bt] = { n: 0, hits: 0, spent: 0, paid: 0, refund: 0 });
    t.n += gp.keys.length; t.hits += ghit; t.spent += cost; t.paid += gpay; t.refund += gref;
    out.push({ ...gp, st, pay: gpay, ref: gref });
  });
  const st = S.stats; st.races++; st.spent += spent; st.paid += pay; st.refund += ref; if (pay > 0) st.hitRaces++;
  const accTxt = r.acc ? ` (${r.acc.no}${{ KET: '欠', RAK: '落', SIK: '失' }[r.acc.type]})` : '';
  st.hist.unshift({ r: r.label, order: r.order.slice(0, 3).join('-') + accTxt, spent, pay, ref }); st.hist = st.hist.slice(0, 10);
  st.yoso.n++; const yHit = r.yoso.picks.includes(win.st[0]); if (yHit) st.yoso.hits++;
  S.bal += pay + ref;
  if (mode === 'rich') S.maxAsset = Math.max(S.maxAsset || 0, S.bal);
  if (mode === 'day') { if (pay > 0) S.day.hits++; const best = out.flatMap(g => g.keys.filter(k => g.st[k] === 'win').map(k => ({ amt: ENG.payout(g.unit, g.odds[k]), type: btById(g.bt).name, key: k, race: r.label }))).sort((a, b) => b.amt - a.amt)[0]; if (best && (!S.day.best || best.amt > S.day.best.amt)) S.day.best = best; }
  const news = World.record(r, r.no);
  // 次のレースへ進める（リロードしてもやり直せない）
  const wasFinal = mode === 'day' && S.raceNo >= 12;
  S.raceNo++; S.seed = randSeed(); S.groups = []; S.racing = false;
  if (wasFinal) S.day.finished = true;
  saveMode();
  return { groups: out, spent, pay, ref, yHit, race: r, wasFinal, news };
}

// ===== 画面：出走表など =====
const wk = n => `<span class="waku w${n}">${n}</span>`;
const TYPE_C = { '逃': '#ff6b6b', '両': '#f2c94c', '追': '#5fd0e6' };
function lineHTML(lines) { return lines.map(l => `<span class="lineg">${l.map(wk).join('')}</span>`).join(''); }
function renderRace() {
  $('rnum').textContent = race.label;
  $('rmode').textContent = MODES[mode].name;

// ===== 効果音（Web Audioで合成。音声ファイルなし） =====
const Sound = {
  on: (() => { try { return localStorage.getItem('keirin_sound_v1') === '1'; } catch (e) { return false; } })(),
  ctx: null, out: null, buf: null, live: new Set(),
  ensure() {
    if (!this.on) return null;
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      this.ctx = new AC(); this.out = this.ctx.createGain(); this.out.gain.value = 0.55; this.out.connect(this.ctx.destination);
      const n = this.ctx.sampleRate * 2; this.buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate); const d = this.buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  set(v) { this.on = v; try { localStorage.setItem('keirin_sound_v1', v ? '1' : '0'); } catch (e) {} if (v) { this.ensure(); this.play('bell'); } else this.stop(); renderSnd(); },
  stop() { this.live.forEach(n => { try { n.stop(); } catch (e) {} }); this.live.clear(); },
  src(node, t0, t1) { this.live.add(node); node.onended = () => this.live.delete(node); node.start(t0); node.stop(t1); },
  env(t0, peak, atk, dec) { const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + atk); g.gain.exponentialRampToValueAtTime(0.0001, t0 + atk + dec); return g; },
  tone(type, f, t0, peak, atk, dec) { const c = this.ctx, o = c.createOscillator(), g = this.env(t0, peak, atk, dec); o.type = type; o.frequency.value = f; o.connect(g).connect(this.out); this.src(o, t0, t0 + atk + dec + 0.05); return o; },
  noise(t0, dur, fType, f, q) { const c = this.ctx, s = c.createBufferSource(); s.buffer = this.buf; s.loop = true; const fl = c.createBiquadFilter(); fl.type = fType; fl.frequency.value = f; fl.Q.value = q; s.connect(fl); this.src(s, t0, t0 + dur); return fl; },
  play(name) {
    if (!this.on || !this.ensure()) return;
    const c = this.ctx, t = c.currentTime + 0.01;
    if (name === 'gun') {        // 号砲
      const g = this.env(t, 0.9, 0.003, 0.4); this.noise(t, 0.5, 'bandpass', 900, 0.6).connect(g).connect(this.out);
      const o = this.tone('sine', 120, t, 0.7, 0.003, 0.25); o.frequency.exponentialRampToValueAtTime(45, t + 0.25);
    } else if (name === 'bell') { // ジャンの鐘
      this.tone('triangle', 1480, t, 0.35, 0.002, 0.28); this.tone('sine', 3330, t, 0.12, 0.002, 0.14); this.tone('sine', 2210, t, 0.08, 0.002, 0.2);
    } else if (name === 'roar') { // 最後の直線の歓声（約4秒で最高潮、ゴール後に引く）
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 3.6); g.gain.setValueAtTime(0.32, t + 3.9); g.gain.exponentialRampToValueAtTime(0.0001, t + 6.5);
      this.noise(t, 6.6, 'bandpass', 700, 0.4).connect(g).connect(this.out);
      const g2 = c.createGain(); g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.12, t + 3.6); g2.gain.exponentialRampToValueAtTime(0.0001, t + 6);
      this.noise(t, 6.6, 'bandpass', 1900, 1.2).connect(g2).connect(this.out);
    } else if (name === 'win') {  // 的中
      [523, 659, 784, 1047].forEach((f, i) => this.tone('square', f, t + i * 0.09, 0.09, 0.005, i === 3 ? 0.4 : 0.1));
    } else if (name === 'jackpot') { // 大当たり
      [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => this.tone('square', f, t + i * 0.11, 0.09, 0.005, i === 7 ? 0.8 : 0.12));
      [262, 392, 523].forEach(f => this.tone('triangle', f, t + 0.77, 0.12, 0.01, 1.0));
    }
  },
};

const clsUp = (from, to) => World.ORDER.indexOf(to) < World.ORDER.indexOf(from);
const PLACE_C = p => p === 1 ? 'p1' : p === 2 ? 'p2' : p === 3 ? 'p3' : typeof p === 'string' ? 'px' : '';
function spark(vals) {
  if (vals.length < 2) return '<div class="empty">期替わりのたびに記録されます</div>';
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = Math.max(1, mx - mn), Wd = 300, Ht = 60;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * (Wd - 16) + 8).toFixed(1)},${(Ht - 8 - (v - mn) / rg * (Ht - 16)).toFixed(1)}`);
  const last = pts[pts.length - 1].split(',');
  return `<svg viewBox="0 0 ${Wd} ${Ht}" class="spark"><polyline points="${pts.join(' ')}" fill="none" stroke="#f2c94c" stroke-width="2"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="#f2c94c"/></svg>
    <div class="sparkax"><span>第1期〜</span><span>最低 ${mn.toFixed(2)} ・ 最高 ${mx.toFixed(2)} ・ 今 ${vals[vals.length - 1].toFixed(2)}</span></div>`;
}

  h += `<div class="btnrow"><button class="btn ghost sm" id="toRoster">👤 選手名鑑${back ? 'に戻る' : 'を見る'}</button></div>`;
  openModal(h);
  $('sheetBox').scrollTop = 0;
  $('toRoster').onclick = () => showRoster(back || R.c);
}
function showRoster(cls = 'SS') {
  const cur = World.period(), all = World.ROSTER.map(x => World.get(x.id));
  const list = all.filter(x => x.c === cls).sort((a, b) => b.s - a.s);
  const news = World.news();
  const nUp = news ? news.list.filter(m => clsUp(m.from, m.to)).length : 0;
  let h = `<h3>👤 選手名鑑 <button class="ibtn" data-close>閉じる</button></h3>
    <p class="hint">第${cur}期 ・ 次の級班の入れ替えまで あと${World.left()}レース<br>あなたが遊んだ${World.PERIOD}レースごとに期が替わり、各級班の得点上位が昇級・下位が降級します（SSはS1の上位がSSの下位を上回ったときだけ入れ替え）。</p>
    ${news ? `<div class="note">第${news.period}期の級班が決まりました（昇級・降級 各${nUp}人）。▲▼が今期上がった・下がった選手です。</div>` : ''}
    <div class="ctabs">${World.ORDER.map(c => `<button class="tab ${c === cls ? 'on' : ''}" data-cls="${c}">${c}<small>${all.filter(x => x.c === c).length}人</small></button>`).join('')}</div>
    <table class="roster"><thead><tr><th>順</th><th>選手</th><th class="num">得点</th><th class="num">成績</th></tr></thead><tbody>
    ${list.map((x, i) => { const mv = x.ch.length && x.ch[x.ch.length - 1][0] === cur - 1 ? x.ch[x.ch.length - 1] : null;
      return `<tr data-rid="${x.id}" data-back="${cls}"><td class="px">${i + 1}</td><td><span class="rl">${x.name}</span>${mv ? `<span class="mv ${clsUp(mv[1], mv[2]) ? 'up' : 'dn'}">${clsUp(mv[1], mv[2]) ? '▲' : '▼'}</span>` : ''}<span class="sub">${x.pref} <b style="color:${TYPE_C[x.type]}">${x.type}</b> ${x.ki}期</span></td><td class="num odds">${x.s.toFixed(2)}</td><td class="num">${x.w[0]}勝<span class="sub">${x.st}戦</span></td></tr>`; }).join('')}
    </tbody></table>
    <button class="btn ghost sm" id="worldReset" style="margin-top:14px">選手の成績と級班を最初に戻す</button>`;
  openModal(h);
  $('sheetBox').querySelector('.ctabs').onclick = e => { const b = e.target.closest('[data-cls]'); if (b) showRoster(b.dataset.cls); };
  $('worldReset').onclick = () => confirmBox('500人全員の成績・得点・級班を最初の状態に戻しますか？　所持金や車券の成績はそのままです。', '戻す', () => { World.reset(); toast('選手データを最初に戻しました'); showRoster('SS'); });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-rid]'); if (!el) return;
  showRider(+el.dataset.rid, el.dataset.back || '');
});

// ===== Xにシェア =====
function shareX(text) {
  const u = 'https://x.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(CONFIG.SHARE_URL) + '&hashtags=' + encodeURIComponent(CONFIG.HASHTAG);
  const w = window.open(u, '_blank'); if (!w) location.href = u;
}

// ===== モーダル・トースト =====
let modalLock = false;
function openModal(html, opt = {}) { $('sheetBox').onclick = null; $('sheetBox').innerHTML = html; $('modal').classList.remove('hidden'); $('modal').classList.toggle('center', !!opt.center); modalLock = !!opt.lock; }
function closeModal() { $('modal').classList.add('hidden'); $('sheetBox').innerHTML = ''; modalLock = false; }
$('modal').onclick = e => { if (e.target.closest('[data-close]') || (e.target === $('modal') && !modalLock)) closeModal(); };
function confirmBox(msg, ok, cb) {
  openModal(`<h3>確認</h3><p>${msg}</p><div class="btnrow"><button class="btn ghost sm" data-close>やめる</button><button class="btn sm" id="cfOk">${ok}</button></div>`, { center: true });
  $('cfOk').onclick = () => { closeModal(); cb(); };
}
let tt; function toast(s) { const el = $('toast'); el.textContent = s; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2000); }

// ===== 大当たり演出 =====
function jackpot() {
  const c = $('confetti'), g = c.getContext('2d'); c.classList.remove('hidden'); $('jack').classList.remove('hidden');
  c.width = innerWidth; c.height = innerHeight;
  const P = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height * 0.6, v: 2 + Math.random() * 4, w: Math.random() * 6.28, col: ['#f2c94c', '#ffe58a', '#fff3c4', '#d4a017', '#ffffff'][Math.random() * 5 | 0] }));
  const t0 = performance.now();
  (function f(now) { const t = (now - t0) / 1000; g.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.y += p.v; p.x += Math.sin(t * 3 + p.w) * 1.5; g.fillStyle = p.col; g.fillRect(p.x | 0, p.y | 0, 6, Math.abs(Math.sin(t * 6 + p.w)) * 6 + 2); });
    if (t < 3.6) requestAnimationFrame(f); else { c.classList.add('hidden'); $('jack').classList.add('hidden'); } })(t0);
}

// ===== 予想屋の顔（ドット絵） =====
const FACE = ['................', '....KKKKKKKK....', '...KKKKKKKKKK...', '..WWWWWWRWWWWWW.', '..WWWWWRRRWWWWWW', '..SSSSSSSSSSSSWW', '.SSKKKSSSSKKKSS.', '.SSSESSSSSSESSSP', 'SSSSSSSSSSSSSSPP', '.SSSSSSNNSSSSPG.', '.SSSSSSSSSSSSS..', '.SSSDDDDDDDSSS..', '..SSSMMMMMSSS...', '...SSSSSSSSS....', '....CCCCCCCC....', '..CCCCCCCCCCCC..'];
const FCOL = { K: '#2a2a2a', W: '#fafafa', R: '#e53935', S: '#f1c27d', E: '#1a1a1a', N: '#d9a066', D: '#5a3a1a', M: '#b33a3a', P: '#e53935', G: '#f2d08a', C: '#2b5fa8' };
function drawFace(c) { const g = c.getContext('2d'); g.clearRect(0, 0, 16, 16); FACE.forEach((r, y) => [...r].forEach((ch, x) => { if (FCOL[ch]) { g.fillStyle = FCOL[ch]; g.fillRect(x, y, 1, 1); } })); }

// ===== タイトル画面 =====
let heroRaf = null;
function drawHero() {
  const c = $('hero'), W = 220, H = 64; c.width = W; c.height = H; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const t0 = performance.now(); const hist = [[], [], [], [], [], []];
  cancelAnimationFrame(heroRaf);
  (function f(now) {
    if ($('titleScr').classList.contains('hidden')) return;
    const t = (now - t0) / 1000;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x += 2) { const h = (H - y) / H; g.fillStyle = y < 6 ? '#3f8f4a' : (((x + Math.floor(t * 60)) % 40) < 1 && y > 50) ? '#ffffff' : h > 0.7 ? '#a9a49a' : h > 0.35 ? '#b9b4a9' : '#c5c0b4'; g.fillRect(x, y, 2, 1); }
    for (let i = 0; i < 9; i++) {
      const x = ((t * (30 + (i % 3) * 1.1) + i * 22) % (W + 40)) - 20, y = 10 + (i % 3) * 16 + Math.sin(t * 1.5 + i) * 1;
      for (let k = 1; k < 6; k++) { g.globalAlpha = 0.5 - k * 0.08; g.fillStyle = '#ffffff'; g.fillRect((x - 9 - k * 3) | 0, (y + 2 + (k % 3) * 3) | 0, 2, 1); }
      g.globalAlpha = 1; g.drawImage(RaceView.riderSprite(i + 1, Math.floor(t * 12 + i) % 8), (x - 8) | 0, (y - 8) | 0);
    }
    heroRaf = requestAnimationFrame(f);
  })(t0);
}
function showTitle() {
  phase = 'title'; mode = null;
  if (running && running.skip) { /* レース中に戻る場合は結果を確定 */ }
  $('titleScr').classList.remove('hidden'); $('gameScr').classList.add('hidden');
  ['modeChip', 'statsBtn', 'balBox'].forEach(id => $(id).classList.add('hidden'));
  const d = peekMode('day'), r = peekMode('rich'), s = peekMode('simple'), today = jstDate();
  const dToday = d && d.day && d.day.date === today;
  const dTxt = !dToday ? '今日はまだ遊んでいません' : d.day.finished ? `${d.day.attempt}回目終了（${yen(d.bal)}円）・もう一度挑戦できます` : `${d.day.attempt}回目 ${d.raceNo}R目 ／ 所持金 ${yen(d.bal)}円`;
  $('modeList').innerHTML = `
    <button class="mode day" data-mode="day"><div class="mt">1日モード <small>軍資金 ${yen(MODES.day.start)}円</small></div><p>${yen(MODES.day.start)}円で12レース（7RからS級、12RはS級決勝）。挑戦するたびにレースも結果も変わり、何回でも遊べます。ランキングはその日の自己ベスト。<br><b style="color:var(--gold)">${dTxt}</b></p></button>
    <button class="mode" data-mode="rich"><div class="mt">富豪モード <small>軍資金 1億円</small></div><p>上限なし、全額勝負も可。100万円以上の的中で大当たり演出。<br><b style="color:var(--gold)">${r ? `資産 ${yen(r.bal)}円 ／ 最高 ${yen(r.maxAsset || 1e8)}円` : '未プレイ'}</b></p></button>
    <button class="mode" data-mode="simple"><div class="mt">人生モード <small>軍資金 100,000円</small></div><p>勝って負けて、また買う。破産しても10万円から人生やり直し（やり直した回数は記録されます）。<br><b style="color:var(--gold)">${s ? `${(s.broke || 0) + 1}回目の人生 ／ 所持金 ${yen(s.bal)}円` : '未プレイ'}</b></p></button>`;
  drawHero(); renderAccount(); window.scrollTo({ top: 0 });
}
$('modeList').onclick = e => { const b = e.target.closest('[data-mode]'); if (b) startMode(b.dataset.mode); };
$('hTitle').onclick = () => { if (phase === 'race') { toast('レース中はタイトルに戻れません'); return; } if (mode) showTitle(); };
function startMode(m) {
  mode = m; S = loadMode(m); saveMode();
  $('titleScr').classList.add('hidden'); $('gameScr').classList.remove('hidden');
  ['modeChip', 'statsBtn', 'balBox'].forEach(id => $(id).classList.remove('hidden'));
  $('modeChip').textContent = MODES[m].name;
  $('amount').value = m === 'rich' ? 100000 : 100;
  curType = BT[3]; curMode = 'normal'; rows = [[], [], []];
  // レース中に閉じた場合は、そのレースの結果を確定させる
  if (S.racing && S.groups.length) { makeRace(); const res = settle(race, S.groups.map(g => ({ ...g }))); toast(`前回のレース結果を反映しました（払戻 ${yen(res.pay + res.ref)}円）`); }
  else if (S.racing) { S.racing = false; saveMode(); }
  toBet(); window.scrollTo({ top: 0 });
}

// ===== 起動 =====
$('hTitle').textContent = '🚴 ' + CONFIG.GAME_NAME;
$('tTitle').textContent = CONFIG.GAME_NAME;

}
